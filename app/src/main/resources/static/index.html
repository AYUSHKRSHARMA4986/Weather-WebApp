<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Weather App</title>

    <!-- Modern Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<div class="creator-mark">
    Made by A.K.Sharma
</div>
<body>

<div class="weather-container">
    <h1>🌤️ Weather</h1>

    <div class="search-box">
        <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
        >
        <button onclick="getWeather()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </button>
    </div>

    <div id="loading" class="hidden">Fetching forecast...</div>
    <p id="error" class="hidden"></p>

    <div id="weatherResult" class="weather-card hidden">
        <h2 id="city"></h2>

        <div class="temperature">
            <span id="temperature"></span><span class="unit">°C</span>
        </div>

        <p id="condition" class="condition-badge"></p>

        <div class="details">
            <!-- Row 1 -->
            <div class="detail-box">
                <span class="icon">💧</span>
                <div class="detail-info">
                    <p>Humidity</p>
                    <h4><span id="humidity"></span>%</h4>
                </div>
            </div>
            <div class="detail-box">
                <span class="icon">💨</span>
                <div class="detail-info">
                    <p>Wind</p>
                    <h4><span id="wind"></span> km/h</h4>
                </div>
            </div>

            <!-- Row 2 -->
            <div class="detail-box">
                <span class="icon">☁️</span>
                <div class="detail-info">
                    <p>Cloud</p>
                    <h4><span id="cloud"></span>%</h4>
                </div>
            </div>
            <div class="detail-box">
                <span class="icon">👁️</span>
                <div class="detail-info">
                    <p>Visibility</p>
                    <h4><span id="visibility"></span> km</h4>
                </div>
            </div>

            <!-- Row 3 -->
            <div class="detail-box">
                <span class="icon">☀️</span>
                <div class="detail-info">
                    <p>UV Index</p>
                    <h4><span id="uv"></span></h4>
                </div>
            </div>
            <div class="detail-box">
                <span class="icon">🌧️</span>
                <div class="detail-info">
                    <p>Rain %</p>
                    <h4><span id="rain"></span>%</h4>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
